
# FlowBench's & custom arguments
attack:
  - pcfa
attack_iterations:
  - 20
output_path: outputs/attack 
ckpt_path: sintel

# PTLFlow arguments (i.e., model and data parameters)
model: 
  class_path: my_new_models.raft.my_very_own_raft # can of course also be a pre-defined model from PTLFlow
  init_args:
    iters: 12
data:
  val_dataset: sintel-final+kitti-2015
