name: tests

on:
  push:
  workflow_dispatch:

jobs:
  run_attacks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            packages: "torch==2.4.1 torchvision==0.19.1"
          - python: "3.10"
            packages: "torch==2.5.1 torchvision==0.20.1"
          - python: "3.11"
            packages: "torch==2.6.0 torchvision==0.21.0"
          - python: "3.x"
            packages: "torch torchvision"   # newest available
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Show runner resources
        run: |
          free -h
          nproc

      - name: Install PyTorch (CPU build)
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.packages }} --index-url https://download.pytorch.org/whl/cpu

      - name: Install ptlflow
        working-directory: _ptlflow
        run: pip install --ignore-requires-python -e .

      - name: Install other dependencies
        run: pip install "setuptools<81" imagecorruptions cospgd

      - name: Install project
        run: pip install -e . pytest

      - name: Show versions
        run: python -c "import sys, torch; print(sys.version); print(torch.__version__)"

      - name: Run tests
        working-directory: tests
        run: (while true; do date +%T; free -m | sed -n 2p; sleep 5; done) & bash test_attacks_objectapi.sh
