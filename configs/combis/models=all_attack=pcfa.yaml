# cd FlowBench
# python -m flowbench.attacks_combis --config configs/combis/models=all_attack=pcfa.yaml --data.dataset_config_path ...

config_1:
  # prioritize
  - configs/partial_configs/models/_raft*
  - configs/partial_configs/models/generated_raft*
  - configs/partial_configs/models/*gma*
  - configs/partial_configs/models/*
config_2:
  - configs/partial_configs/attacks_objectapi/pcfa_it=20_eps=5e-3_box=cov.yaml
  - configs/partial_configs/attacks_objectapi/pcfa_it=20_eps=5e-2_box=cov.yaml
  - configs/partial_configs/attacks_objectapi/pcfa_it=1_eps=5e-3_box=cov.yaml
config_3:
  - configs/partial_configs/data/kitti-2015-trainval.yaml
  - configs/partial_configs/data/sintel-final-trainval.yaml

# global configs, passed to all calls (unless overwritten in configs above; not sure about resolution order) 
output_path: outputs/flowbench_objectapi/combis/pcfa_bestiterate
write_outputs: False
skip_existing: True
ignore_errors: True
check_for_missing_grads: True
